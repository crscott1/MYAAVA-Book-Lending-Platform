<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MYAAVA - Community Book Lending</title>
    <link rel="stylesheet" th:href="@{/layui/css/layui.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="/css/custom-style.css">
    <style>
        body {
            background-color: #f8f8fc;
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
        }

        .login-wrapper {
            display: flex;
            height: 100vh;
        }

        .login-image {
            flex: 1;
            background: url('/images/background.png') center center no-repeat;
            background-size: cover;
        }

        .login-form-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            padding: 40px;
            box-shadow: -4px 0 16px rgba(0,0,0,0.05);
        }

        #login_form {
            width: 100%;
            max-width: 400px;
        }

        #login_form h1 {
            color: #6C63FF;
            font-weight: 700;
            text-align: center;
        }

        #login_form h2 {
            color: #333;
            font-weight: 600;
            text-align: center;
            margin-bottom: 24px;
        }

        .layui-form-item label {
            font-weight: 600;
            color: #444;
        }

        .layui-btn-normal {
            background-color: #6C63FF;
            border-radius: 8px;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-image"></div>
    <div class="login-form-container">
        <div id="login_form">

            <h1>Book Lending System</h1>
            <h2>User Login</h2>

            <form class="layui-form" id="my_form" method="post" action="/userLogin">

                <div class="layui-form-item">
                    <label class="layui-form-label">User Name:</label>
                    <div class="layui-input-block">
                        <input type="text" name="userName" id="username" autofocus
                               placeholder="Please enter user name" autocomplete="off" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">Password:</label>
                    <div class="layui-input-block">
                        <input type="password" name="password" id="password"
                               placeholder="Please enter password" autocomplete="off" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">User Role</label>
                    <div class="layui-input-block">
                        <input class="form-check-input" type="radio" name="role" value="1" title="Public" checked>
                        <input class="form-check-input" type="radio" name="role" value="0" title="Administrator">
                    </div>
                </div>

                <div class="layui-form-item">
                    <button id="sub_btn" class="layui-btn layui-btn-normal">Login</button>
                </div>

            </form>
        </div>
    </div>
</div>

<script th:src="@{/scripts/jquery.min.js}"></script>
<script th:src="@{/layui/layui.js}"></script>
<script th:inline="javascript">
    layui.use(['layer', 'form'], function () {
        let layer = layui.layer;
        let form = layui.form;
        form.render();

        $(function () {
            let flag = [[${session.flag}]];
            if (flag) {
                layer.msg("Wrong username or password", {
                    icon: 2,
                    time: 2000
                });
            }
        });
    });

    $("#sub_btn").click(function () {
        let username = $("#username").val();
        if (!username.trim()) {
            layer.alert("Username cannot be empty", {icon: 5, title: 'Information', btn: ['OK']});
            return false;
        }
        let password = $("#password").val();
        if (!password.trim()) {
            layer.alert("Password cannot be empty", {icon: 5, title: 'Information', btn: ['OK']});
            return false;
        }

        let role_id = $('input[name="role"]:checked').val();
        if (role_id == 1) {
            $("#my_form").submit();
        } else {
            $("#my_form").attr("action", "/adminLogin").submit();
        }
    });
</script>
</body>
</html>
