<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User - Community Book Lending System</title>
    <link href="/layui/css/layui.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="/css/custom-style.css" rel="stylesheet"/>
    <style>
        .user-info-card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            max-width: 960px;
            margin: 40px auto;
        }
        .user-info-card h2 {
            font-family: 'Nunito', sans-serif;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
        }
        .user-info-card table {
            width: 100%;
        }
        .user-info-card thead th {
            background-color: #f3e8ff;
        }
        .user-info-card .layui-btn {
            display: block;
            margin: 20px auto 0;
            background-color: #6C63FF;
            color: white;
            font-weight: 600;
            border-radius: 8px;
        }
        #window {
            max-width: 500px;
            margin: 40px auto;
        }
    </style>
</head>
<body class="layui-layout-body">

<div class="layui-layout layui-layout-admin">
    <div th:include="common/user_header :: header"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">
                <li class="layui-nav-item">
                    <a class="" href="javascript:;">Borrow Management</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/userBorrowBookRecord">&emsp;&emsp;Borrowing Record</a></dd>
                        <dd><a href="/borrowingPage">&emsp;&emsp;Borrowing Books</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item">
                    <a class="" href="javascript:;">Book Management</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/userReturnBooksPage">&emsp;&emsp;Returning Books</a></dd>
                        <dd><a href="/findBookPage">&emsp;&emsp;Search Book</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item layui-nav-itemed"><a class="" href="/userMessagePage">Personal Information</a></li>
            </ul>
        </div>
    </div>

    <div class="layui-body">
        <div class="user-info-card">
            <h2>Personal Information</h2>
            <table class="layui-table">
                <thead>
                <tr>
                    <th>User ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Password</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td><b th:text="${session.user.getUserId()}"></b></td>
                    <td><b th:text="${session.user.getUserName()}"></b></td>
                    <td><b th:text="${session.user.getUserEmail()}"></b></td>
                    <td><b th:text="${session.user.getUserPwd()}"></b></td>
                </tr>
                </tbody>
            </table>
            <button id="modify-user" class="layui-btn">Modify Information</button>
        </div>

        <div id="window" title="Modify information" style="display: none">
            <form id="updateUserForm" class="layui-form">
                <div class="layui-form-item">
                    <label class="layui-form-label">Name</label>
                    <div class="layui-input-block">
                        <input type="text" name="userName" th:value="${session.user.getUserName()}" id="name" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">Email</label>
                    <div class="layui-input-block">
                        <input type="text" name="UserEmail" th:value="${session.user.getUserEmail()}" id="email" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">Password</label>
                    <div class="layui-input-block">
                        <input type="text" name="userPwd" id="password" class="layui-input" th:value="${session.user.getUserPwd()}">
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div th:include="common/footer :: footer"></div>
</div>

<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/scripts/user/userMessage.js"></script>

</body>
</html>
