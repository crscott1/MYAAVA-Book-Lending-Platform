<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User - Community Book Lending System</title>
    <link href="/layui/css/layui.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="/css/custom-style.css" rel="stylesheet"/>
    <style>
        /* 自定义表格表头背景为淡紫色 */
        .layui-table thead th {
            background-color: #f3e8ff !important;
        }
    </style>
</head>
<body class="layui-layout-body">
<div class="layui-layout layui-layout-admin">

    <div th:include="common/user_header :: header" class="user-header"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">

                <li class="layui-nav-item layui-nav-itemed">
                    <a class="" href="javascript:;">Borrow Management</a>
                    <dl class="layui-nav-child">
                        <dd class="layui-this"><a href="/userBorrowBookRecord">&emsp;&emsp;Borrowing Record</a></dd>
                        <dd><a href="/borrowingPage">&emsp;&emsp;Borrowing Books</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">Book Management</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/userReturnBooksPage">&emsp;&emsp;Return Books</a></dd>
                        <dd><a href="/findBookPage">&emsp;&emsp;Search Books</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item"><a href="/userMessagePage">Personal Information</a></li>
            </ul>
        </div>
    </div>

    <div class="layui-body user-index-body">
        <div class="record-card">
            <h2 class="page-title">Borrowed Books</h2>
            <table class="layui-table layui-form">
                <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Name</th>
                    <th>Borrowing Date</th>
                    <th>Return Date</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="borrowingBooks : ${borrowingBooksList}">
                    <td><label th:text="${borrowingBooks.getBook().getBookId()}"></label></td>
                    <td>
                        <label id="bookName" th:title="${borrowingBooks.getBook().getBookAuthor()}"
                               th:text="${borrowingBooks.getBook().getBookName()}">Title ...</label>
                    </td>
                    <td><label th:text="${borrowingBooks.getDateOfBorrowing()}"></label></td>
                    <td><label th:text="${borrowingBooks.getDateOfReturn()}"></label></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:include="common/footer :: footer"></div>

</div>

<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script>
    layui.use('element', function () {
        let element = layui.element;
    });
</script>

</body>
</html>
