<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrator - Community Book Lending System</title>
    <link href="/layui/css/layui.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="/css/custom-style.css" rel="stylesheet"/>
    <style>
        .pagination-wrapper button.layui-btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            height: 36px;
            line-height: 36px;
        }
    </style>
</head>
<body>
<div class="layui-layout layui-layout-admin">

    <div th:include="common/admin_header :: header"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">
                <li class="layui-nav-item">
                    <a class="" href="javascript:;">Book Management</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/addBookPage">&emsp;&emsp;Add New Book</a></dd>
                        <dd><a href="/addCategoryPage?pageNum=1">&emsp;&emsp;New Category</a></dd>
                        <dd><a href="/showBooksPage">&emsp;&emsp;Search Books</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item">
                    <a class="" href="javascript:;">User Management</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/showUsersPage?pageNum=1">&emsp;&emsp;Search User</a></dd>
                        <dd><a href="/addUserPage">&emsp;&emsp;Add User</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item layui-nav-itemed">
                    <a class="" href="javascript:;">Borrowing Record</a>
                    <dl class="layui-nav-child">
                        <dd class="layui-this"><a href="/allBorrowBooksRecordPage?pageNum=1">&emsp;&emsp;All Records</a></dd>
                    </dl>
                </li>
                <li class="layui-nav-item"><a href="/adminInfoPage">Personal Information</a></li>
            </ul>
        </div>
    </div>

    <div class="layui-body record-page-body">
        <div class="record-card">
            <h2 class="page-title">All Borrowing Records</h2>
            <table class="layui-table layui-form">
                <thead>
                <tr>
                    <th>User</th>
                    <th>Book</th>
                    <th>Borrowing Date</th>
                    <th>Return Date</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="borrowingBooks : ${page.getList()}">
                    <td><label th:text="${borrowingBooks.getUser().getUserName()}"></label></td>
                    <td><label th:text="${borrowingBooks.getBook().getBookName()}"></label></td>
                    <td><label th:text="${borrowingBooks.getDateOfBorrowing()}"></label></td>
                    <td><label th:text="${borrowingBooks.getDateOfReturn()}"></label></td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <td colspan="4">
                        <div class="pagination-wrapper">
                            <a th:href="@{/allBorrowBooksRecordPage(pageNum=${page.getPageNum()-1})}">
                                <button class="layui-btn layui-btn-sm">Last</button>
                            </a>
                            <span th:text="${page.getPageNum()}"></span>
                            <span>/</span>
                            <span th:text="${page.getPageCount()}"></span>
                            <a th:href="@{/allBorrowBooksRecordPage(pageNum=${page.getPageNum()+1})}">
                                <button class="layui-btn layui-btn-sm">Next</button>
                            </a>
                        </div>
                    </td>
                </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div th:include="common/footer :: footer"></div>
</div>

<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/scripts/admin/allBorrowingBooksRecord.js"></script>
</body>
</html>
