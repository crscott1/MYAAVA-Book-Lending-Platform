<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrator-Community Book Lending System</title>
    <link href="/layui/css/layui.css" rel="stylesheet" media="all"/>
    <!-- ✅ 加入圆润字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- ✅ 引入自定义样式覆盖 -->
    <link href="/css/custom-style.css" rel="stylesheet"/>
</head>

<body>
<div class="layui-layout layui-layout-admin">

    <div th:include="common/admin_header :: header"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">

                <li class="layui-nav-item layui-nav-itemed">
                    <a class="" href="javascript:;">Book Management</a>
                    <dl class="layui-nav-child">
                        <dd class="layui-this"><a href="/addBookPage">&emsp;&emsp;Add New Book</a></dd>
                        <dd><a href="/addCategoryPage?pageNum=1">&emsp;&emsp;New Category</a></dd>
                        <dd><a href="/showBooksPage">&emsp;&emsp;Search Books</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">User Management</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/showUsersPage?pageNum=1">&emsp;&emsp;Search User</a></dd>
                        <dd><a href="/addUserPage">&emsp;&emsp;Add User</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">Borrowing Record</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/allBorrowBooksRecordPage?pageNum=1">&emsp;&emsp;All Records</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item"><a href="/adminInfoPage">Personal Information</a></li>
            </ul>
        </div>
    </div>

    <!-- ✅ 主体内容区域美化 -->
    <div class="layui-body add-book-body">
    <div class="add-book-container">
            <h2 class="add-book-title">Add New Book</h2>
            <form class="layui-form centered-form" id="addBookForm">

            <div class="layui-form-item">
                    <label class="layui-form-label">Book Name</label>
                    <div class="layui-input-inline">
                        <input required lay-verify="required" id="bookName" type="text" name="bookName"
                               placeholder="Please enter book name" autofocus
                               class="layui-input" autocomplete="off">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">Author</label>
                    <div class="layui-input-inline">
                        <input id="bookAuthor" lay-verify="required" type="text" name="bookAuthor" placeholder="Please enter author"
                               autocomplete="off" class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">Publisher</label>
                    <div class="layui-input-inline">
                        <input id="bookPublish" lay-verify="required" type="text" name="bookPublish"
                               placeholder="Please enter publisher" autocomplete="off"
                               class="layui-input">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label">Category</label>
                    <div class="layui-input-inline">
                        <select lay-verify="required" id="bookCategory" name="bookCategory">
                            <option value="">--- Please select ---</option>
                        </select>
                    </div>
                </div>

<!--                 <div class="layui-form-item">
                    <label class="layui-form-label">Price</label>
                    <div class="layui-input-inline">
                        <input id="bookPrice" lay-verify="number" type="text" name="bookPrice" placeholder="$"
                               autocomplete="off" class="layui-input">
                    </div>
                </div> -->

                <div class="layui-form-item layui-form-text">
                    <label class="layui-form-label">Description</label>
                    <div class="layui-input-inline">
                        <textarea id="bookIntroduction" lay-verify="required" name="bookIntroduction" placeholder="Please enter a description"
                                  class="layui-textarea"
                                  autocomplete="off"></textarea>
                    </div>
                </div>

                <div style="margin-left: 130px">
                    <input type="submit" lay-filter="btn1" id="btn1" class="layui-btn" lay-submit="" value="Add New Book">
                </div>

            </form>
        </div>
    </div>

    <div th:include="common/footer :: footer"></div>

</div>

<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/scripts/admin/addBook.js"></script>

</body>
</html>
