<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrator-Community Book Lending System</title>
    <link href="/layui/css/layui.css" rel="stylesheet"/>

</head>
<div class="layui-layout layui-layout-admin">

    <div th:include="common/admin_header :: header"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">

                <li class="layui-nav-item layui-nav-itemed">
                    <a class="" href="javascript:;">Book Management</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/addBookPage">&emsp;&emsp;Add New Book</a></dd>
                        <dd><a href="/addCategoryPage?pageNum=1">&emsp;&emsp;New category</a></dd>
                        <dd class="layui-this"><a href="/showBooksPage">&emsp;&emsp;Search book</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item ">
                    <a class="" href="javascript:;">User Management</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/showUsersPage?pageNum=1">&emsp;&emsp;Search User</a></dd>
                        <dd><a href="/addUserPage">&emsp;&emsp;Add User</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item ">
                    <a class="" href="javascript:;">Borrowing Record</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/allBorrowBooksRecordPage?pageNum=1">&emsp;&emsp;All Records</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item"><a href="/adminInfoPage">Personal information</a></li>
            </ul>
        </div>
    </div>

    <div class="layui-body layui-container">

        <div class="layui-row">

            <div class="layui-col-md3">

                <hr class="layui-bg-blue">
                <h2 style="text-align:center">Search Book</h2>
                <hr class="layui-bg-blue">

                <form class="layui-form" action="/showBooksResultPageByCategoryId" id="bookCategoryForm">

                    <div class="layui-form-item">

                        <div style="margin: 20px;">
                            <label>Search by Category</label>
                        </div>

                        <div>
                            <select lay-verify="required" class="layui-select" id="bookCategory" name="bookCategory">
                            </select>
                        </div>
                    </div>

                    <input type="text" name="pageNum" value="1" style="display: none">

                    <input class="layui-btn" type="submit" lay-submit="" value="Search">
                </form>
            </div>

            <div class="layui-col-md7 layui-col-md-offset2">

                <hr class="layui-bg-blue">
                <h2 style="text-align:center">Search Results</h2>
                <hr class="layui-bg-blue">


                <table class="layui-table" lay-size="sm">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Author</th>
                        <th>Publisher</th>
                        <th>Status</th>
                    </tr>
                    </thead>

                    <tr th:each="book:${page.getList()}">
                        <td><label th:text="${book.getBookId()}"></label></td>
                        <td><label th:text="${book.getBookName()}"></label></td>
                        <td><label th:text="${book.getBookAuthor()}"></label></td>
                        <td><label th:text="${book.getBookPublish()}"></label></td>
                        <td><label th:text="${book.getIsExist()}"></label></td>
                    </tr>

                    <tr>
                        <td colspan="5">
                            <div style="margin: auto; width: 160px;">

                                <a id="prePage"
                                   th:href="@{/showBooksResultPageByCategoryId(pageNum=${page.getPageNum()-1},bookCategory=${bookCategory})}">
                                    <button class="layui-btn layui-btn-sm">Last</button>
                                </a>
                                <label id="lab1" th:text="${page.getPageNum()}"></label>

                                <span>/</span>

                                <label id="lab2" th:text="${page.getPageCount()}"></label>
                                <a id="nextPage"
                                   th:href="@{/showBooksResultPageByCategoryId(pageNum=${page.getPageNum()+1},bookCategory=${bookCategory})}">
                                    <button class="layui-btn layui-btn-sm">Next</button>
                                </a>
                            </div>

                        </td>
                    </tr>
                </table>
            </div>
        </div>

    </div>
    <div th:include="common/footer :: footer"></div>

</div>

<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/scripts/admin/showBooks.js"></script>

</body>
</html>
