<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administrator - Community Book Lending System</title>
    <link href="/layui/css/layui.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="/css/custom-style.css" rel="stylesheet"/>
</head>

<body>
<div class="layui-layout layui-layout-admin">

    <div th:include="common/admin_header :: header"></div>

    <div class="layui-side layui-bg-black">
        <div class="layui-side-scroll">
            <ul class="layui-nav layui-nav-tree">

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">Book Management</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/addBookPage">&emsp;&emsp;Add New Book</a></dd>
                        <dd><a href="/addCategoryPage?pageNum=1">&emsp;&emsp;New Category</a></dd>
                        <dd><a href="/showBooksPage">&emsp;&emsp;Search Books</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">User Management</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/showUsersPage?pageNum=1">&emsp;&emsp;Search User</a></dd>
                        <dd><a href="/addUserPage">&emsp;&emsp;Add User</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item">
                    <a class="" href="javascript:;">Borrowing Record</a>
                    <dl class="layui-nav-child">
                        <dd><a href="/allBorrowBooksRecordPage?pageNum=1">&emsp;&emsp;All Records</a></dd>
                    </dl>
                </li>

                <li class="layui-nav-item layui-nav-itemed"><a class="" href="/adminInfoPage">Personal Information</a></li>
            </ul>
        </div>
    </div>

    <div class="layui-body info-page-body">
        <div class="admin-info-card">
            <h2 class="page-title">Administrator Information</h2>

            <table class="layui-table layui-form">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Password</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td><b th:text="${session.admin.getAdminId()}"></b></td>
                    <td><b th:text="${session.admin.getAdminName()}"></b></td>
                    <td><b th:text="${session.admin.getAdminEmail()}"></b></td>
                    <td><b th:text="${session.admin.getAdminPwd()}"></b></td>
                </tr>
                </tbody>
            </table>

            <div class="pagination-wrapper">
                <button id="modify-admin" class="layui-btn">Modify Information</button>
            </div>

            <div id="window" class="admin-edit-window" title="修改信息" style="display: none">
                <form id="updateAdminForm" class="layui-form">
                    <div class="layui-form-item">
                        <label class="layui-form-label">Name</label>
                        <div class="layui-input-block">
                            <input type="text" name="adminName" th:value="${session.admin.getAdminName()}" id="name" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">Email</label>
                        <div class="layui-input-block">
                            <input type="text" name="adminEmail" th:value="${session.admin.getAdminEmail()}" id="email" class="layui-input">
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <label class="layui-form-label">Password</label>
                        <div class="layui-input-block">
                            <input type="text" name="adminPwd" id="password" th:value="${session.admin.getAdminPwd()}" class="layui-input">
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:include="common/footer :: footer"></div>
</div>

<script src="/scripts/jquery.min.js"></script>
<script src="/layui/layui.js"></script>
<script src="/scripts/admin/adminInfo.js"></script>
</body>
</html>
